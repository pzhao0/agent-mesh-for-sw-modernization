name: Build and push images (manual)

# Required repository secrets:
# - QUAY_USERNAME: Quay robot-account username with push access to rh-ai-quickstart.
# - QUAY_PASSWORD: Token for the Quay robot account.
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch or tag to build
        required: false
        default: main
        type: string
      version:
        description: Valid OCI tag applied to every image (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

# Cancel duplicate builds of the same source ref and image version.
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ inputs.target_branch }}-${{ inputs.version }}
  cancel-in-progress: true

env:
  KFP_IMAGE_REGISTRY: quay.io/rh-ai-quickstart
  KFP_DATA_GENERATION_BASE_IMAGE_NAME: agent-mesh-for-sw-modernization-data-generation
  KFP_INDEXING_BASE_IMAGE_NAME: agent-mesh-for-sw-modernization-data-indexing
  # Analysis intentionally uses the same image as indexing.
  KFP_ANALYSIS_BASE_IMAGE_NAME: agent-mesh-for-sw-modernization-data-indexing
  KFP_PIPELINE_TOOLS_IMAGE_NAME: agent-mesh-for-sw-modernization-pipeline-tools

jobs:
  build-and-push:
    name: Build and push KFP images
    runs-on: ubuntu-latest

    steps:
      - name: Validate image version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Version must be a valid OCI tag: 1-128 characters, beginning with alphanumeric or underscore, followed by alphanumeric characters, underscores, periods, or hyphens." >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push data-generation image
        uses: docker/build-push-action@v6
        with:
          context: resources/images/data-generation
          file: resources/images/data-generation/Containerfile
          push: true
          tags: ${{ env.KFP_IMAGE_REGISTRY }}/${{ env.KFP_DATA_GENERATION_BASE_IMAGE_NAME }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Analysis and indexing deliberately use the same image.
      - name: Build and push data-indexing image
        uses: docker/build-push-action@v6
        with:
          context: resources/images/data-indexing
          file: resources/images/data-indexing/Containerfile
          push: true
          tags: ${{ env.KFP_IMAGE_REGISTRY }}/${{ env.KFP_INDEXING_BASE_IMAGE_NAME }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push pipeline-tools image
        uses: docker/build-push-action@v6
        with:
          context: resources/images/pipeline-tools
          file: resources/images/pipeline-tools/Containerfile
          push: true
          tags: ${{ env.KFP_IMAGE_REGISTRY }}/${{ env.KFP_PIPELINE_TOOLS_IMAGE_NAME }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
