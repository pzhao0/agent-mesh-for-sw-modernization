name: Build and push images (manual)

on:
  workflow_dispatch:
    inputs:
      github_username:
        description: GitHub username or organization that owns the source repository
        required: false
        default: rh-ai-quickstart
        type: string
      target_branch:
        description: Branch or tag to build
        required: false
        default: main
        type: string
      version:
        description: Tag applied to every KFP image (for example, v0.1.0)
        required: true
        type: string

# Cancel any previous runs of this workflow for the same commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  KFP_IMAGE_REGISTRY: quay.io/rh-ai-quickstart
  KFP_DATA_GENERATION_BASE_IMAGE_NAME: agent-mesh-for-sw-modernization-data-generation
  KFP_INDEXING_BASE_IMAGE_NAME: agent-mesh-for-sw-modernization-data-indexing
  # Analysis intentionally uses the same image as indexing.
  KFP_ANALYSIS_BASE_IMAGE_NAME: agent-mesh-for-sw-modernization-data-indexing
  KFP_PIPELINE_TOOLS_IMAGE_NAME: agent-mesh-for-sw-modernization-pipeline-tools

jobs:
  build-and-push:
    name: Build and push KFP images
    runs-on: ubuntu-latest

    steps:
      - name: Determine repository and ref
        id: checkout_info
        shell: bash
        run: |
          echo "repository=${{ inputs.github_username }}/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ inputs.target_branch }}" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.checkout_info.outputs.repository }}
          ref: ${{ steps.checkout_info.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push data-generation image
        uses: docker/build-push-action@v6
        with:
          context: resources/images/data-generation
          file: resources/images/data-generation/Containerfile
          push: true
          tags: ${{ env.KFP_IMAGE_REGISTRY }}/${{ env.KFP_DATA_GENERATION_BASE_IMAGE_NAME }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Analysis and indexing deliberately use the same image.
      - name: Build and push data-indexing image
        uses: docker/build-push-action@v6
        with:
          context: resources/images/data-indexing
          file: resources/images/data-indexing/Containerfile
          push: true
          tags: ${{ env.KFP_IMAGE_REGISTRY }}/${{ env.KFP_INDEXING_BASE_IMAGE_NAME }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push pipeline-tools image
        uses: docker/build-push-action@v6
        with:
          context: resources/images/pipeline-tools
          file: resources/images/pipeline-tools/Containerfile
          push: true
          tags: ${{ env.KFP_IMAGE_REGISTRY }}/${{ env.KFP_PIPELINE_TOOLS_IMAGE_NAME }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
