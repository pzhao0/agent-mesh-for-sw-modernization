apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: muse-glimmer-30b-fp8
  namespace: {{ .Release.Namespace }}
  labels:
    app: muse-glimmer-30b-fp8
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Muse Glimmer 30B FP8
    serving.kserve.io/deploymentMode: {{ .Values.serving.deploymentMode | quote }}
    {{- with .Values.serving.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  predictor:
    minReplicas: {{ .Values.replicaCount }}
    maxReplicas: {{ .Values.replicaCount }}
    deploymentStrategy:
      type: Recreate
    serviceAccountName: muse-glimmer-30b-fp8
    nodeSelector:
      {{- toYaml .Values.nodeSelector | nindent 6 }}
    tolerations:
      {{- toYaml .Values.tolerations | nindent 6 }}
    model:
      runtime: muse-glimmer-30b-fp8
      modelFormat:
        name: pytorch
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: muse-glimmer-30b-fp8-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: {{ .Values.shmSize }}
