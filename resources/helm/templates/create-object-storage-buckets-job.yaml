{{- if .Values.objectStorage.createBuckets }}
apiVersion: batch/v1
kind: Job
metadata:
  name: create-object-storage-buckets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: agent-mesh-for-sw
    app.kubernetes.io/component: object-storage-bootstrap
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agent-mesh-for-sw
        app.kubernetes.io/component: object-storage-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: create-buckets
          image: {{ .Values.s4.image | quote }}
          imagePullPolicy: {{ .Values.s4.imagePullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until existing_buckets=$(s5cmd --endpoint-url "$AWS_ENDPOINT_URL" ls 2>&1); do
                echo "S4 is not ready, retrying in 5 seconds..."
                sleep 5
              done

              for bucket in "$PIPELINE_BUCKET" "$TEMPO_BUCKET"; do
                if printf '%s\n' "$existing_buckets" | awk '{print $NF}' | grep -Fxq "s3://$bucket"; then
                  echo "Bucket $bucket already exists."
                else
                  s5cmd --endpoint-url "$AWS_ENDPOINT_URL" mb "s3://$bucket"
                fi
              done
          env:
            - name: HOME
              value: /tmp
            - name: AWS_ENDPOINT_URL
              value: http://s4.{{ .Values.namespace }}.svc.cluster.local:7480
            - name: AWS_REGION
              value: {{ .Values.objectStorage.region | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s4-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s4-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: PIPELINE_BUCKET
              value: {{ .Values.objectStorage.pipelineBucket | quote }}
            - name: TEMPO_BUCKET
              value: {{ .Values.otel.tempo.bucket | quote }}
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
{{- end }}
