{{- $config := include "agent-model.config" . | fromYaml -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agent-model.fullname" . }}-cache
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - {{ $config.cache.accessMode }}
  resources:
    requests:
      storage: {{ $config.cache.size }}
  storageClassName: {{ $config.cache.storageClassName }}
