[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmesh-code-understanding"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
test = [
    "fastapi>=0.115.6",
    "graphrag==2.6.0",
    "httpx2>=2.0.0",
    "jsonpath-ng>=1.7.0",
    "kfp==2.17.0",
    "kfp-kubernetes==2.14.3",
    "kubernetes>=8.0.0,<31",
    "mlflow>=2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.40.0",
    "PyGithub>=2.0.0",
    "pydantic>=2.0.0",
    "pytest>=8,<9",
    "python-multipart>=0.0.20",
    "pyyaml==6.0.2",
    "uvicorn[standard]>=0.34.0",
]
lint = [
    "black>=26.0.0",
    "flake8>=7.0.0",
    "isort>=7.0.0",
]

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 99

[tool.setuptools]
package-dir = {"" = "workflows/examples/code_understanding"}

[tool.setuptools.packages.find]
where = ["workflows/examples/code_understanding"]
namespaces = true
exclude = ["scripts*", "notebooks*", "compiled_pipelines*", "*.egg-info*"]

[tool.setuptools.package-data]
"*" = [
    "*.sh",
    "*.json",
    "*.jsonl",
    "*.yaml",
    "*.yaml.in",
    "*.toml",
    "*.txt",
    "*.md",
    "*.csv",
    "*.tsv",
    "*.xml",
    "*.jinja",
    "*.jinja2",
    "*.j2",
    "*.in",
    "*.html",
    "*.parquet",
]

[tool.uv]
package = false
